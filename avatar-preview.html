<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Hoang — Avatar Studio</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #f4f0f7; background: #111015; font: 14px system-ui, sans-serif; }
      #viewer { width: 100%; height: 100svh; }
      canvas { display: block; touch-action: none; }
      header { position: fixed; top: 28px; left: 32px; pointer-events: none; }
      header p { margin: 6px 0; color: #aaa5b5; }
      h1 { margin: 0; font-size: 24px; font-weight: 500; }
      footer { position: fixed; bottom: 24px; left: 24px; right: 24px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
      button { border: 1px solid #47414f; color: inherit; background: #201c27; border-radius: 9px; padding: 12px 17px; cursor: pointer; }
      button:hover, button[aria-pressed="true"] { border-color: #c2a4ff; background: #382b4d; }
      #status { position: fixed; top: 28px; right: 32px; color: #aaa5b5; max-width: 260px; text-align: right; }
      @media(max-width: 600px) { header { left: 18px; top: 18px; } #status { top: 95px; left: 18px; text-align: left; } footer { bottom: 12px; left: 12px; right: 12px; gap: 5px; } button { padding: 10px 12px; } }
    </style>
  </head>
  <body>
    <header><h1>Hoang · Avatar Studio</h1><p>Face, hair & motion review · neutral lighting</p></header>
    <div id="status" role="status">Loading avatar…</div>
    <div id="viewer"></div>
    <footer aria-label="Avatar controls">
      <button data-angle="0" aria-pressed="true">Front</button>
      <button data-angle="-0.65" aria-pressed="false">¾ left</button>
      <button data-angle="0.65" aria-pressed="false">¾ right</button>
      <button data-angle="-1.57" aria-pressed="false">Left profile</button>
      <button data-angle="1.57" aria-pressed="false">Right profile</button>
      <button data-angle="3.14159" aria-pressed="false">Back</button>
      <button id="rotate" aria-pressed="false">Turntable</button>
      <button id="motion" aria-pressed="true">Motion: on</button>
      <button id="export">Export GLB</button>
    </footer>
    <script type="module" src="/src/avatar-preview.ts"></script>
  </body>
</html>
