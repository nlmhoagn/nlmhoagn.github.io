<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120e0a" />
      <stop offset="50%" stop-color="#1f1610" />
      <stop offset="100%" stop-color="#0a0806" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bgGrad4)" stroke="#3d281a" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="25" y="24" width="550" height="42" rx="10" fill="rgba(24, 18, 14, 0.9)" stroke="rgba(255,255,255,0.1)" />
  <circle cx="48" cy="45" r="5" fill="#f97316" />
  <text x="62" y="49" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Vietnam Electronics Design Contest 2026</text>
  <rect x="385" y="32" width="175" height="25" rx="6" fill="rgba(249, 115, 22, 0.15)" stroke="#f97316" stroke-width="1" />
  <text x="398" y="49" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">SMART HEALTH SCALE</text>

  <!-- Flowchart Architecture -->
  <g transform="translate(30, 95)">
    <!-- Stage 1: Sensor Array Acquisition -->
    <rect x="0" y="20" width="115" height="110" rx="8" fill="#1c1611" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" />
    <text x="14" y="45" fill="#fdba74" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">Step 1</text>
    <text x="14" y="68" fill="#fff" font-family="'Inter', sans-serif" font-size="12" font-weight="600">FSR Matrix &amp;</text>
    <text x="14" y="85" fill="#fff" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Load Cells</text>
    <text x="14" y="112" fill="#78716c" font-size="9" font-family="monospace">Biometric Array</text>

    <!-- Fork from Step 1 to Parallel Branches -->
    <path d="M 115 75 L 130 75 L 145 32" stroke="#fb923c" stroke-width="1.8" />
    <path d="M 115 75 L 130 75 L 145 112" stroke="#fb923c" stroke-width="1.8" />

    <!-- Stage 2: Dual Edge Sampling & Processing -->
    <g transform="translate(145, 0)">
      <!-- 24-bit ADC Branch -->
      <rect x="0" y="0" width="125" height="65" rx="8" fill="#241b14" stroke="#f59e0b" stroke-width="1.2" />
      <text x="12" y="25" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">24-bit ADC</text>
      <text x="12" y="48" fill="#cbd5e1" font-size="10" font-family="sans-serif">HX711 Micro-Volt Read</text>

      <!-- ESP32-S3 Dual Core Processing Branch -->
      <rect x="0" y="80" width="125" height="65" rx="8" fill="#1a2233" stroke="#38bdf8" stroke-width="1.2" />
      <text x="12" y="105" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">ESP32-S3 Core</text>
      <text x="12" y="128" fill="#cbd5e1" font-size="10" font-family="sans-serif">Xtensa LX7 @ 240MHz</text>
    </g>

    <!-- Merge into Step 3 -->
    <path d="M 270 32 L 292 75 L 315 75" stroke="#fbbf24" stroke-width="1.8" />
    <path d="M 270 112 L 292 75 L 315 75" stroke="#38bdf8" stroke-width="1.8" />

    <!-- Stage 3: Kalman Signal Smoothing -->
    <g transform="translate(315, 20)">
      <rect x="0" y="0" width="115" height="110" rx="8" fill="#1f1838" stroke="#a855f7" stroke-width="1.5" />
      <text x="14" y="30" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">Step 3</text>
      <text x="14" y="55" fill="#fff" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Kalman</text>
      <text x="14" y="72" fill="#fff" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Filter</text>
      <text x="14" y="98" fill="#e879f9" font-size="10" font-family="monospace">Anti-Vibration</text>
    </g>

    <!-- Arrow 3 to Output -->
    <path d="M 430 75 L 460 75" stroke="#a855f7" stroke-width="2" />

    <!-- Final Output -->
    <g transform="translate(460, 20)">
      <rect x="0" y="0" width="80" height="110" rx="8" fill="#132320" stroke="#10b981" stroke-width="1.5" />
      <text x="12" y="35" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">OUTPUT</text>
      <text x="12" y="60" fill="#fff" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Smart</text>
      <text x="12" y="78" fill="#fff" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Telemetry</text>
      <circle cx="40" cy="95" r="4" fill="#10b981" />
    </g>
  </g>

  <!-- Metrics Bar Bottom -->
  <g transform="translate(30, 295)">
    <rect width="540" height="50" rx="8" fill="rgba(24, 18, 14, 0.85)" stroke="rgba(255,255,255,0.06)" />
    <text x="25" y="30" fill="#a8a29e" font-size="11">Firmware: <tspan fill="#38bdf8" font-weight="bold">FreeRTOS + Dual A/B Rollback OTA</tspan></text>
    <text x="310" y="30" fill="#a8a29e" font-size="11">Algorithm: <tspan fill="#fb923c" font-weight="bold">Discrete Kalman Filter + BIA Matrix</tspan></text>
  </g>
</svg>
