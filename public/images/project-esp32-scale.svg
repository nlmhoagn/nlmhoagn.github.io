<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f0c" />
      <stop offset="50%" stop-color="#241710" />
      <stop offset="100%" stop-color="#0f0b09" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bgGrad4)" stroke="#4a2e1d" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="25" y="24" width="550" height="42" rx="10" fill="rgba(25, 17, 13, 0.9)" stroke="rgba(255,255,255,0.1)" />
  <circle cx="48" cy="45" r="5" fill="#f97316" />
  <text x="62" y="49" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Vietnam Electronics Design Contest 2026</text>
  <rect x="390" y="32" width="170" height="25" rx="6" fill="rgba(249, 115, 22, 0.15)" stroke="#f97316" stroke-width="1" />
  <text x="404" y="49" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">ESP32-S3 HEALTH SCALE</text>

  <!-- Left: Foot-pressure Heatmap Matrix -->
  <g transform="translate(45, 95)">
    <rect width="180" height="175" rx="10" fill="#1b120d" stroke="rgba(255,255,255,0.1)" />
    <text x="16" y="26" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">PRESSURE HEATMAP</text>

    <!-- Heatmap Footprint Silhouette -->
    <!-- Left foot heat points -->
    <ellipse cx="65" cy="65" rx="14" ry="12" fill="#ef4444" opacity="0.8" filter="blur(3px)" />
    <ellipse cx="65" cy="95" rx="10" ry="14" fill="#f97316" opacity="0.7" filter="blur(4px)" />
    <ellipse cx="65" cy="130" rx="12" ry="12" fill="#eab308" opacity="0.8" filter="blur(3px)" />

    <!-- Right foot heat points -->
    <ellipse cx="115" cy="65" rx="14" ry="12" fill="#ef4444" opacity="0.8" filter="blur(3px)" />
    <ellipse cx="115" cy="95" rx="10" ry="14" fill="#f97316" opacity="0.7" filter="blur(4px)" />
    <ellipse cx="115" cy="130" rx="12" ry="12" fill="#eab308" opacity="0.8" filter="blur(3px)" />

    <text x="35" y="162" fill="#a8a29e" font-size="9" font-family="monospace">Bicubic Interpolation</text>
  </g>

  <!-- Right: Microcontroller & Signal Processing -->
  <g transform="translate(250, 95)">
    <!-- ESP32-S3 Chip Graphic -->
    <rect width="300" height="85" rx="8" fill="#18131d" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="25" cy="25" r="4" fill="#6366f1" />
    <text x="40" y="29" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">ESP32-S3 SOC Core</text>
    <text x="25" y="55" fill="#a5b4fc" font-size="10" font-family="sans-serif">• 16-channel Force-Sensitive Resistors (FSR)</text>
    <text x="25" y="72" fill="#a5b4fc" font-size="10" font-family="sans-serif">• Dual-core Xtensa LX7 @ 240MHz</text>

    <!-- Kalman Filter & OTA Stack -->
    <g transform="translate(0, 95)">
      <!-- Kalman Filter Box -->
      <rect width="142" height="80" rx="8" fill="#1c1611" stroke="#f97316" stroke-width="1" />
      <text x="12" y="24" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">Kalman Filter</text>
      <path d="M 15 55 Q 40 40, 70 50 T 125 45" stroke="#ef4444" stroke-width="1" stroke-dasharray="2 2" fill="none" />
      <path d="M 15 55 Q 40 45, 70 48 T 125 47" stroke="#22c55e" stroke-width="2" fill="none" />
      <text x="12" y="70" fill="#a8a29e" font-size="8" font-family="monospace">Sensor Smoothing</text>

      <!-- OTA Updates Box -->
      <rect x="155" y="0" width="145" height="80" rx="8" fill="#1c1611" stroke="#10b981" stroke-width="1" />
      <text x="14" y="24" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">Reliable OTA</text>
      <text x="14" y="45" fill="#e2e8f0" font-size="9" font-family="sans-serif">A/B Dual Partition</text>
      <text x="14" y="60" fill="#a7f3d0" font-size="8" font-family="monospace">Auto-Rollback Support</text>
    </g>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(30, 295)">
    <rect width="540" height="48" rx="8" fill="rgba(25, 20, 15, 0.85)" stroke="rgba(255,255,255,0.06)" />
    <text x="25" y="29" fill="#a8a29e" font-size="11">Hardware: <tspan fill="#fb923c" font-weight="bold">ESP32-S3 + FSR Array</tspan></text>
    <text x="260" y="29" fill="#a8a29e" font-size="11">Firmware: <tspan fill="#34d399" font-weight="bold">Kalman Smoothing & Fail-safe OTA</tspan></text>
  </g>
</svg>
