<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d" />
      <stop offset="50%" stop-color="#141e36" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bgGrad2)" stroke="#23355e" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="25" y="24" width="550" height="42" rx="10" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.1)" />
  <circle cx="48" cy="45" r="5" fill="#38bdf8" />
  <text x="62" y="49" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">HCMC AI Challenge 2026 • Vecna Team</text>
  <rect x="385" y="32" width="175" height="25" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
  <text x="398" y="49" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">TRAFFIC VIDEO VQA</text>

  <!-- Flowchart Architecture -->
  <g transform="translate(30, 95)">
    <!-- Stage 1: Video Stream Ingestion -->
    <rect x="0" y="20" width="115" height="110" rx="8" fill="#151e33" stroke="rgba(255,255,255,0.1)" />
    <text x="14" y="45" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">Step 1</text>
    <text x="14" y="68" fill="#fff" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Video Ingest</text>
    <text x="14" y="85" fill="#fff" font-family="'Inter', sans-serif" font-size="12" font-weight="600">&amp; Keyframes</text>
    <text x="14" y="112" fill="#64748b" font-size="9" font-family="monospace">CCTV Streams</text>

    <!-- Arrow 1 -->
    <path d="M 120 75 L 140 75" stroke="#38bdf8" stroke-width="2" />

    <!-- Stage 2: Dual Multimodal Extraction -->
    <g transform="translate(145, 0)">
      <!-- SigLIP Visual Embeddings Branch -->
      <rect x="0" y="0" width="125" height="65" rx="8" fill="#1a2540" stroke="#f59e0b" stroke-width="1" />
      <text x="12" y="25" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">SigLIP Vision</text>
      <text x="12" y="48" fill="#cbd5e1" font-size="10" font-family="sans-serif">Dense Frame Vectors</text>

      <!-- OCR & Audio ASR Branch -->
      <rect x="0" y="80" width="125" height="65" rx="8" fill="#1a2540" stroke="#38bdf8" stroke-width="1" />
      <text x="12" y="105" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">OCR &amp; ASR</text>
      <text x="12" y="128" fill="#cbd5e1" font-size="10" font-family="sans-serif">Plate &amp; Speech Text</text>
    </g>

    <!-- Arrow 2 Merge -->
    <path d="M 275 32 L 305 75" stroke="#fbbf24" stroke-width="1.5" />
    <path d="M 275 112 L 305 75" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Stage 3: Milvus Multi-Modal Fusion -->
    <g transform="translate(315, 20)">
      <rect x="0" y="0" width="115" height="110" rx="8" fill="#1f1838" stroke="#a855f7" stroke-width="1.5" />
      <text x="14" y="30" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">Step 3</text>
      <text x="14" y="55" fill="#fff" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Milvus</text>
      <text x="14" y="72" fill="#fff" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Fusion</text>
      <text x="14" y="98" fill="#e879f9" font-size="10" font-family="monospace">HNSW Search</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 435 75 L 455 75" stroke="#a855f7" stroke-width="2" />

    <!-- Final Output -->
    <g transform="translate(460, 20)">
      <rect x="0" y="0" width="80" height="110" rx="8" fill="#132320" stroke="#10b981" stroke-width="1.5" />
      <text x="12" y="35" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">OUTPUT</text>
      <text x="12" y="60" fill="#fff" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Ranked</text>
      <text x="12" y="78" fill="#fff" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Moments</text>
      <circle cx="40" cy="95" r="4" fill="#10b981" />
    </g>
  </g>

  <!-- Metrics Bar Bottom -->
  <g transform="translate(30, 295)">
    <rect width="540" height="50" rx="8" fill="rgba(20, 25, 40, 0.85)" stroke="rgba(255,255,255,0.06)" />
    <text x="25" y="30" fill="#94a3b8" font-size="11">Vector DB: <tspan fill="#38bdf8" font-weight="bold">Milvus Cluster (HNSW)</tspan></text>
    <text x="310" y="30" fill="#94a3b8" font-size="11">Pipeline: <tspan fill="#c084fc" font-weight="bold">SigLIP + PaddleOCR + Whisper ASR</tspan></text>
  </g>
</svg>
