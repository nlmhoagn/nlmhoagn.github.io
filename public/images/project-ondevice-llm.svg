<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110d1c" />
      <stop offset="50%" stop-color="#1b142e" />
      <stop offset="100%" stop-color="#0a0812" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bgGrad6)" stroke="#392659" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="25" y="24" width="550" height="42" rx="10" fill="rgba(23, 17, 38, 0.9)" stroke="rgba(255,255,255,0.1)" />
  <circle cx="48" cy="45" r="5" fill="#a855f7" />
  <text x="62" y="49" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Edge AI &amp; Efficient Computing Research</text>
  <rect x="385" y="32" width="175" height="25" rx="6" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1" />
  <text x="400" y="49" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">ON-DEVICE SLM &amp; KG</text>

  <!-- Flowchart Architecture -->
  <g transform="translate(30, 95)">
    <!-- Stage 1: Base SLM Model -->
    <rect x="0" y="20" width="115" height="110" rx="8" fill="#1b152d" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" />
    <text x="14" y="45" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">Step 1</text>
    <text x="14" y="68" fill="#fff" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Small LM</text>
    <text x="14" y="85" fill="#fff" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Transformer</text>
    <text x="14" y="112" fill="#94a3b8" font-size="9" font-family="monospace">1B - 3B Params</text>

    <!-- Fork from Step 1 to Parallel Branches -->
    <path d="M 115 75 L 130 75 L 145 32" stroke="#a855f7" stroke-width="1.8" />
    <path d="M 115 75 L 130 75 L 145 112" stroke="#a855f7" stroke-width="1.8" />

    <!-- Stage 2: Dual Compression & Knowledge Augmentation -->
    <g transform="translate(145, 0)">
      <!-- AWQ INT4 Branch -->
      <rect x="0" y="0" width="125" height="65" rx="8" fill="#241b14" stroke="#f59e0b" stroke-width="1.2" />
      <text x="12" y="25" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">AWQ / INT4</text>
      <text x="12" y="48" fill="#cbd5e1" font-size="10" font-family="sans-serif">Weight Quantization</text>

      <!-- Knowledge Graph Branch -->
      <rect x="0" y="80" width="125" height="65" rx="8" fill="#16253b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="12" y="105" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">Knowledge Graph</text>
      <text x="12" y="128" fill="#cbd5e1" font-size="10" font-family="sans-serif">Symbolic Reasoning</text>
    </g>

    <!-- Merge into Step 3 -->
    <path d="M 270 32 L 292 75 L 315 75" stroke="#fbbf24" stroke-width="1.8" />
    <path d="M 270 112 L 292 75 L 315 75" stroke="#38bdf8" stroke-width="1.8" />

    <!-- Stage 3: On-Device NPU Engine -->
    <g transform="translate(315, 20)">
      <rect x="0" y="0" width="115" height="110" rx="8" fill="#1f1838" stroke="#a855f7" stroke-width="1.5" />
      <text x="14" y="30" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">Step 3</text>
      <text x="14" y="55" fill="#fff" font-family="'Inter', sans-serif" font-size="12" font-weight="600">NPU Engine</text>
      <text x="14" y="72" fill="#fff" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Runtime</text>
      <text x="14" y="98" fill="#e879f9" font-size="10" font-family="monospace">Low-Latency</text>
    </g>

    <!-- Arrow 3 to Output -->
    <path d="M 430 75 L 460 75" stroke="#a855f7" stroke-width="2" />

    <!-- Final Output -->
    <g transform="translate(460, 20)">
      <rect x="0" y="0" width="80" height="110" rx="8" fill="#132320" stroke="#10b981" stroke-width="1.5" />
      <text x="12" y="35" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">OUTPUT</text>
      <text x="12" y="60" fill="#fff" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Private</text>
      <text x="12" y="78" fill="#fff" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Local AI</text>
      <circle cx="40" cy="95" r="4" fill="#10b981" />
    </g>
  </g>

  <!-- Metrics Bar Bottom -->
  <g transform="translate(30, 295)">
    <rect width="540" height="50" rx="8" fill="rgba(23, 17, 38, 0.85)" stroke="rgba(255,255,255,0.06)" />
    <text x="25" y="30" fill="#94a3b8" font-size="11">Hardware: <tspan fill="#38bdf8" font-weight="bold">Edge NPUs &amp; Mobile Silicon</tspan></text>
    <text x="310" y="30" fill="#94a3b8" font-size="11">Paradigm: <tspan fill="#c084fc" font-weight="bold">Neuro-Symbolic Local Inference</tspan></text>
  </g>
</svg>
