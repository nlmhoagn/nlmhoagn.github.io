<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a18" />
      <stop offset="50%" stop-color="#18112b" />
      <stop offset="100%" stop-color="#0c0715" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#00a8ff" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <pattern id="gridPattern1" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad1)" stroke="#392b58" stroke-width="1.5" />
  <rect width="600" height="380" rx="16" fill="url(#gridPattern1)" />

  <!-- Roadway Perspective Lanes -->
  <polygon points="120,380 260,180 340,180 480,380" fill="rgba(255,255,255,0.02)" />
  <!-- Left Lane Line (Emergency Lane) -->
  <line x1="160" y1="380" x2="275" y2="180" stroke="#ff3366" stroke-width="3" stroke-dasharray="10 8" opacity="0.8" />
  <!-- Center Lane Line -->
  <line x1="300" y1="380" x2="300" y2="180" stroke="#00f5ff" stroke-width="2" stroke-dasharray="14 10" opacity="0.6" />
  <!-- Right Lane Line -->
  <line x1="440" y1="380" x2="325" y2="180" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Horizon Glow -->
  <ellipse cx="300" cy="180" rx="150" ry="20" fill="url(#neonPurple)" opacity="0.15" filter="blur(20px)" />

  <!-- Emergency Lane Detection Zone (Red/Orange Polygon) -->
  <polygon points="130,370 230,230 270,230 180,370" fill="rgba(255, 51, 102, 0.12)" stroke="#ff3366" stroke-width="1" stroke-dasharray="4 4" />
  <text x="145" y="320" fill="#ff4d79" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">EMERGENCY LANE ZONE</text>

  <!-- Detected Vehicle Bounding Box -->
  <g transform="translate(195, 235)">
    <!-- Bounding Box -->
    <rect width="90" height="65" rx="6" fill="rgba(255, 51, 102, 0.15)" stroke="#ff3366" stroke-width="2" />
    <path d="M 0 12 L 0 0 L 12 0" stroke="#00f5ff" stroke-width="3" fill="none" />
    <path d="M 78 0 L 90 0 L 90 12" stroke="#00f5ff" stroke-width="3" fill="none" />
    <path d="M 90 53 L 90 65 L 78 65" stroke="#00f5ff" stroke-width="3" fill="none" />
    <path d="M 12 65 L 0 65 L 0 53" stroke="#00f5ff" stroke-width="3" fill="none" />
    
    <!-- Vehicle Silhouette -->
    <path d="M 15 48 L 22 30 L 40 24 L 62 24 L 72 32 L 80 45 L 80 52 L 15 52 Z" fill="rgba(255,255,255,0.2)" />
    <circle cx="28" cy="52" r="5" fill="#333" stroke="#00f5ff" stroke-width="1.5" />
    <circle cx="68" cy="52" r="5" fill="#333" stroke="#00f5ff" stroke-width="1.5" />

    <!-- Label Tag -->
    <rect x="-2" y="-22" width="94" height="20" rx="4" fill="#ff3366" />
    <text x="6" y="-8" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">STOPPED [98.4%]</text>
  </g>

  <!-- Top Status Bar -->
  <rect x="25" y="24" width="550" height="42" rx="10" fill="rgba(15,11,26,0.85)" stroke="rgba(255,255,255,0.1)" />
  <circle cx="48" cy="45" r="5" fill="#00f5ff" />
  <text x="62" y="49" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">ACLAB • Solar-Powered Roadside Monitor</text>
  
  <rect x="420" y="32" width="140" height="25" rx="6" fill="rgba(0, 245, 255, 0.12)" stroke="rgba(0, 245, 255, 0.4)" stroke-width="1" />
  <text x="432" y="49" fill="#00f5ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">EDGE AI: K230</text>

  <!-- Bottom Info Widgets -->
  <g transform="translate(25, 305)">
    <rect width="160" height="52" rx="8" fill="rgba(20, 15, 35, 0.9)" stroke="rgba(255,255,255,0.08)" />
    <text x="14" y="22" fill="#8e83a8" font-family="'Inter', sans-serif" font-size="10">PIPELINE</text>
    <text x="14" y="40" fill="#00f5ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">YOLO + Tracker</text>
  </g>

  <g transform="translate(195, 305)">
    <rect width="180" height="52" rx="8" fill="rgba(20, 15, 35, 0.9)" stroke="rgba(255,255,255,0.08)" />
    <text x="14" y="22" fill="#8e83a8" font-family="'Inter', sans-serif" font-size="10">SAFETY ACTION</text>
    <text x="14" y="40" fill="#ff4d79" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">LED Warning Trigger</text>
  </g>

  <g transform="translate(385, 305)">
    <rect width="190" height="52" rx="8" fill="rgba(20, 15, 35, 0.9)" stroke="rgba(255,255,255,0.08)" />
    <text x="14" y="22" fill="#8e83a8" font-family="'Inter', sans-serif" font-size="10">POWER & DEPLOY</text>
    <text x="14" y="40" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">Solar Standalone</text>
  </g>
</svg>
