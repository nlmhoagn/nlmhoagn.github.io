<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nguyen Le Minh Hoang - Resume</title>
  <style>
    :root {
      --bg: #0b080c;
      --card-bg: #141018;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #aa42ff;
      --accent-light: #c084fc;
      --border: #272033;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 640px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 36px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      text-align: center;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff, var(--accent-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      background: rgba(170, 66, 255, 0.15);
      border: 1px solid rgba(170, 66, 255, 0.4);
      color: var(--accent-light);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    p {
      color: #d1d5db;
      font-size: 15px;
      margin-bottom: 18px;
    }
    .email-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 14px;
      margin: 24px 0 32px 0;
    }
    .email-box a {
      color: var(--accent-light);
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
    }
    .email-box a:hover {
      text-decoration: underline;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .btn {
      background: linear-gradient(135deg, #aa42ff, #7e22ce);
      color: #fff;
      border: none;
      padding: 12px 26px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Nguyen Le Minh Hoang</h1>
    <div class="badge">Curriculum Vitae • Private</div>
    
    <p>
      The complete CV &amp; project portfolio is temporarily set to confidential.
    </p>
    <p style="color: var(--text-muted); font-size: 14px;">
      For verified academic inquiries, research collaborations, or recruitment, please reach out directly:
    </p>

    <div class="email-box">
      <a href="mailto:hoang.nguyen102@hcmut.edu.vn">hoang.nguyen102@hcmut.edu.vn</a>
    </div>

    <div class="actions">
      <a class="btn" href="./">Return to Portfolio</a>
      <a class="btn btn-secondary" href="mailto:hoang.nguyen102@hcmut.edu.vn">Send Inquiry</a>
    </div>
  </div>
</body>
</html>
